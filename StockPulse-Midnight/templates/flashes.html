<div aria-live="polite">{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{ 'error' if category=='danger' else 'warning' if category=='warning' else 'success' if category=='success' else '' }}" role="{{ 'alert' if category=='danger' else 'status' }}"><p>{{ message }}</p><button class="dismiss" type="button" data-dismiss aria-label="Dismiss message">×</button></div>{% endfor %}</div>
